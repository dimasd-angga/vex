[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vex"
version = "0.2.0"
description = "Agent-first red team framework for AI systems — probe LLMs, agents, MCP servers, and RAG pipelines for safety failures and exploitable vulnerabilities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dishant Desle" },
]
keywords = [
    "ai-security",
    "red-team",
    "llm-security",
    "prompt-injection",
    "jailbreak",
    "agent-security",
    "adversarial-ml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "anyio>=4.3,<5",
    "pyyaml>=6.0,<7",
    "jinja2>=3.1,<4",
    "tenacity>=8.2,<9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40,<1"]
openai = ["openai>=1.40,<2"]
google = ["google-generativeai>=0.7,<1"]
ollama = ["ollama>=0.3,<1"]
all = [
    "anthropic>=0.40,<1",
    "openai>=1.40,<2",
    "google-generativeai>=0.7,<1",
    "ollama>=0.3,<1",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "respx>=0.21,<1",
]

[project.scripts]
vex = "vex.cli:app"

[project.urls]
Homepage = "https://github.com/desledishant10/vex"
Repository = "https://github.com/desledishant10/vex"
Issues = "https://github.com/desledishant10/vex/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vex"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer canonically calls typer.Option() in argument defaults.
"src/vex/cli.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
